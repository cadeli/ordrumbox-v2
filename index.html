<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:">
  
  <title>orDrumbox | Free Online Drum Machine & Step Sequencer</title>
  <meta name="description" content="Create beats with orDrumbox, a free online drum machine. Features step sequencer, soft synth, LFO modulators, and WAV export.">
  
  <meta property="og:title" content="orDrumbox - Free Online Drum Machine">
  <meta property="og:description" content="Create, customize, and export drum patterns directly in your browser.">
  <meta property="og:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <meta property="og:url" content="https://www.ordrumbox.com">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="orDrumbox | Online Beat Maker">
  <meta name="twitter:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <link rel="canonical" href="https://www.ordrumbox.com">

  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "online orDrumbox",
        "description": "Create you own patterns with powerfull custom controls using various styles drumkits ",
        "url": "https://www.ordrumbox.com/index.html",
        "applicationCategory": "Music",
        "operatingSystem": "Web",
        "screenshot": "https://www.ordrumbox.com/assets/images/jsdrumbox-screenshot.png",
        "inLanguage": "en-US",
        "author": {
            "@type": "Organization",
            "name": "orDrumbox Team",
            "url": "https://www.ordrumbox.com"
        },
        "applicationSubCategory": "Music Composition",
        "applicationFeature": [
            "Music Sequencing",
            "Drum Kits",
            "Demo Patterns",
            "Filters",
            "Triggers",
            "Midi",
            "LFO Modulators",
            "Virtual Drum Machine",
            "Virtual Synth"
        ]
    }
    </script>
 
  

  <style>
    #waiting-screen {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: 24px; box-sizing: border-box;
      background-color: #12121e; z-index: 9999;
    }
    #waiting-screen-start-btn {
      position: absolute; top: 66.67%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 36px; font-size: 14px; font-weight: bold;
      border: 2px solid #fff; border-radius: 8px;
      cursor: pointer; background-color: #f59e0b; color: #1a1a2e;
      touch-action: manipulation; transition: background-color 0.2s, transform 0.1s;
      z-index: 1;
    }
    #waiting-screen-start-btn:hover { transform: translate(-50%, -50%) scale(1.02); }
    #waiting-screen-start-btn.ready { background-color: #4fc3f7; color: #1a1a2e; border-color: #e94560; }
  </style>
  <link rel="stylesheet" href="./src/ui/styles.css" id="ui-styles">

</head>
<body>
  <main id="app-main" aria-label="orDrumbox Beat Maker" role="application">
    <div id="waiting-screen">
      <button id="waiting-screen-start-btn">Start orDrumbox V2</button>
    </div>
  </main>
  <script type="module" crossorigin src="./src/waiting_screen.js"></script>
</body>
</html>
