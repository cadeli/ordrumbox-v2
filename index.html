<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:">
  
  <title>orDrumbox | Free Online Drum Machine & Step Sequencer</title>
  <meta name="description" content="Create beats with orDrumbox, a free online drum machine. Features step sequencer, soft synth, LFO modulators, and WAV export.">
  
  <meta property="og:title" content="orDrumbox - Free Online Drum Machine">
  <meta property="og:description" content="Create, customize, and export drum patterns directly in your browser.">
  <meta property="og:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <meta property="og:url" content="https://www.ordrumbox.com">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="orDrumbox | Online Beat Maker">
  <meta name="twitter:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <link rel="canonical" href="https://www.ordrumbox.com">
  <link rel="preload" href="assets/images/logo-big.png" as="image" fetchpriority="high">
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "online orDrumbox",
        "description": "Create you own patterns with powerfull custom controls using various styles drumkits ",
        "url": "https://www.ordrumbox.com/index.html",
        "applicationCategory": "Music",
        "operatingSystem": "Web",
        "screenshot": "https://www.ordrumbox.com/assets/images/jsdrumbox-screenshot.png",
        "inLanguage": "en-US",
        "author": {
            "@type": "Organization",
            "name": "orDrumbox Team",
            "url": "https://www.ordrumbox.com"
        },
        "applicationSubCategory": "Music Composition",
        "applicationFeature": [
            "Music Sequencing",
            "Drum Kits",
            "Demo Patterns",
            "Filters",
            "Triggers",
            "Midi",
            "LFO Modulators",
            "Virtual Drum Machine",
            "Virtual Synth"
        ]
    }
    </script>
 
  

  <style>
    :root {
      --color-canvas-default: #0d0d1a;
      --color-border-default: #333;
      --color-fg-default: #fff;
      --color-fg-muted: #eee;
      --color-accent-fg: #e94560;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-family);
      line-height: 1.5;
      color: var(--color-fg-default);
      background-color: #0a0a14;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Full width app container */
    #insert-ordrumbox-v2-here {
      width: 100%;
      min-height: 100vh;
      background-color: #0a0a14;
    }
    @media (min-width: 1901px), (min-height: 1091px) {
      body {
        justify-content: center;
        min-height: 100vh;
        background: #0a0a14;
      }
      #insert-ordrumbox-v2-here {
        width: 1900px;
        max-height: 1090px;
        overflow: auto;
        margin: auto;
        border: 1px solid #222;
        border-radius: 4px;
        box-shadow: 0 0 60px rgba(0,0,0,.6);
      }
    }

    /* Waiting screen — inlined to prevent CLS */
    #waiting-screen {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 24px; box-sizing: border-box;
      background-color: #12121e;
      z-index: 10000;
    }
    #waiting-screen img {
      max-width: 100%;
      height: auto;
      pointer-events: none;
    }
    #waiting-screen-start-btn {
      position: absolute;
      top: 66.67%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px; font-size: 18px; font-weight: bold;
      border: 3px solid #ffffff; border-radius: 8px;
      cursor: pointer; background-color: #e65100; color: #fff;
      touch-action: manipulation;
      z-index: 1;
    }
    #waiting-screen-start-btn.ready {
      background-color: #1565c0; color: #fff;
    }
  </style>
</head>
<body>
  <main id="app-main" aria-label="orDrumbox Beat Maker">
    <div id="insert-ordrumbox-v2-here" role="application" aria-label="orDrumbox Beat Maker Interface">
      <div id="waiting-screen">
        <img src="assets/images/logo-big.png" alt="orDrumbox v2" width="600" height="300" fetchpriority="high">
        <button id="waiting-screen-start-btn">Start orDrumbox V2</button>
      </div>
    </div>
    <script type="module" crossorigin src="./src/waiting_screen.js"></script>
  </main>
</body>
</html>
