    <body>
        <main id="app-main" aria-label="orDrumbox Beat Maker" role="application">
            <style>
                #waiting-screen {
                    position: fixed;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding: 24px;
                    box-sizing: border-box;
                    overflow: hidden;
                    z-index: 9999;
                    color: #eaffd0;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
                    background:
                        radial-gradient(900px 620px at 12% -12%, rgba(255, 79, 163, 0.38), transparent 62%),
                        radial-gradient(900px 620px at 92% 6%, rgba(55, 224, 255, 0.32), transparent 60%),
                        repeating-linear-gradient(to right, rgba(183, 255, 60, 0.07) 0 1px, transparent 1px 48px),
                        repeating-linear-gradient(to bottom, rgba(183, 255, 60, 0.07) 0 1px, transparent 1px 48px),
                        linear-gradient(180deg, #14163e 0%, #0a0b26 55%, #14163e 100%);
                }
                #waiting-screen::after {
                    content: '';
                    position: absolute;
                    inset: 0;
                    pointer-events: none;
                    background: repeating-linear-gradient(
                        to bottom,
                        rgba(0, 0, 0, 0.16) 0 1px,
                        rgba(0, 0, 0, 0) 1px 3px
                    );
                }

                .ws-console {
                    position: relative;
                    z-index: 1;
                    width: min(760px, 100%);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 16px;
                    padding: 20px 22px 24px;
                    box-sizing: border-box;
                    background: linear-gradient(180deg, rgba(38, 43, 104, 0.94), rgba(20, 22, 62, 0.96));
                    border: 3px solid #06071b;
                    border-radius: 14px;
                    box-shadow:
                        8px 8px 0 rgba(0, 0, 0, 0.55),
                        0 0 48px rgba(55, 224, 255, 0.35);
                }

                .ws-screen {
                    position: relative;
                    width: 100%;
                    height: min(220px, 34vh);
                    min-height: 150px;
                    overflow: hidden;
                    border: 3px solid #06071b;
                    border-radius: 8px;
                    background:
                        repeating-linear-gradient(to right, rgba(155, 188, 15, 0.16) 0 1px, transparent 1px 40px),
                        repeating-linear-gradient(to bottom, rgba(155, 188, 15, 0.16) 0 1px, transparent 1px 40px),
                        radial-gradient(120% 140% at 50% 50%, #0e2a12 0%, #04120b 72%);
                    box-shadow: inset 0 0 34px rgba(183, 255, 60, 0.28);
                }
                .ws-scope {
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                }
                .ws-wave-shift {
                    animation: ws-shift 4.2s linear infinite;
                }
                .ws-wave {
                    fill: none;
                    stroke: #b6ff2e;
                    stroke-width: 3;
                    stroke-linecap: round;
                    stroke-linejoin: round;
                    vector-effect: non-scaling-stroke;
                }
                .ws-wave-glow {
                    stroke: rgba(183, 255, 60, 0.45);
                    stroke-width: 9;
                    filter: blur(4px);
                }
                @keyframes ws-shift {
                    from {
                        transform: translateX(0);
                    }
                    to {
                        transform: translateX(-120px);
                    }
                }
                .ws-beam {
                    position: absolute;
                    top: 0;
                    bottom: 0;
                    width: 2px;
                    background: rgba(55, 224, 255, 0.85);
                    box-shadow: 0 0 12px rgba(55, 224, 255, 0.9);
                    animation: ws-beam 3.6s linear infinite;
                }
                @keyframes ws-beam {
                    from {
                        left: -2%;
                    }
                    to {
                        left: 102%;
                    }
                }
                .ws-title {
                    position: absolute;
                    left: 16px;
                    top: 14px;
                    margin: 0;
                    font-family:
                        'PressStart2P', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
                        monospace;
                    font-weight: 400;
                    font-synthesis: none;
                    font-size: 32px;
                    line-height: 1.4;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #b6ff2e;
                    text-shadow:
                        0 0 14px rgba(183, 255, 60, 0.75),
                        3px 3px 0 rgba(0, 0, 0, 0.65);
                }
                .ws-title span {
                    color: #ff4fa3;
                    text-shadow:
                        0 0 14px rgba(255, 79, 163, 0.75),
                        3px 3px 0 rgba(0, 0, 0, 0.65);
                }
                .ws-screen-label {
                    position: absolute;
                    right: 14px;
                    bottom: 10px;
                    font-family:
                        'PressStart2P', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
                        monospace;
                    font-size: 8px;
                    letter-spacing: 2px;
                    color: rgba(183, 255, 60, 0.85);
                }
                .ws-screen-dots {
                    position: absolute;
                    left: 16px;
                    bottom: 10px;
                    display: flex;
                    gap: 6px;
                }
                .ws-screen-dots i {
                    width: 9px;
                    height: 9px;
                    border: 1px solid #06071b;
                    box-shadow: 0 0 8px currentColor;
                }
                .ws-screen-dots i:nth-child(1) {
                    background: #ff4fa3;
                    color: #ff4fa3;
                }
                .ws-screen-dots i:nth-child(2) {
                    background: #37e0ff;
                    color: #37e0ff;
                }
                .ws-screen-dots i:nth-child(3) {
                    background: #ffe14d;
                    color: #ffe14d;
                }
                .ws-screen-dots i:nth-child(4) {
                    background: #a97bff;
                    color: #a97bff;
                }

                .ws-tagline {
                    margin: 0;
                    padding: 12px 18px;
                    max-width: 100%;
                    box-sizing: border-box;
                    font-size: clamp(13px, 2.1vw, 17px);
                    font-weight: 600;
                    line-height: 1.45;
                    text-align: center;
                    color: #06071b;
                    background: linear-gradient(90deg, #ffe14d, #ff9040 48%, #ff4fa3);
                    border: 3px solid #06071b;
                    border-radius: 9px;
                    box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.55);
                    transform: rotate(-1.1deg);
                }
                .ws-tagline::after {
                    content: '▌';
                    margin-left: 4px;
                    animation: ws-blink 1s steps(2, start) infinite;
                }
                @keyframes ws-blink {
                    to {
                        visibility: hidden;
                    }
                }

                #waiting-screen-start-btn {
                    padding: 16px 34px;
                    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
                    font-size: clamp(11px, 2.2vw, 17px);
                    font-weight: bold;
                    letter-spacing: 1px;
                    border: 3px solid #06071b;
                    border-radius: 10px;
                    cursor: pointer;
                    touch-action: manipulation;
                    background-color: #3f47ad;
                    color: #eaffd0;
                    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55);
                    transition:
                        background-color 0.2s,
                        box-shadow 0.12s,
                        transform 0.1s;
                    z-index: 1;
                }
                #waiting-screen-start-btn:hover {
                    transform: translate(-2px, -2px);
                    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.55);
                }
                #waiting-screen-start-btn:active {
                    transform: translate(4px, 4px);
                    box-shadow: 0 0 0 rgba(0, 0, 0, 0.55);
                }
                #waiting-screen-start-btn.ready {
                    background-color: #9bbc0f;
                    color: #06071b;
                    border-color: #06071b;
                    box-shadow:
                        6px 6px 0 rgba(0, 0, 0, 0.55),
                        0 0 28px rgba(155, 188, 15, 0.75);
                }
                #waiting-screen-start-btn.ready:hover {
                    background-color: #c6e93a;
                    box-shadow:
                        8px 8px 0 rgba(0, 0, 0, 0.55),
                        0 0 38px rgba(198, 233, 58, 0.9);
                }

                .ws-meta {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 6px 14px;
                    font-size: 10px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    color: #9ba4ee;
                }
                .ws-meta span::before {
                    content: '▸';
                    margin-right: 6px;
                    color: #37e0ff;
                }

                @media (max-width: 560px) {
                    .ws-console {
                        gap: 12px;
                        padding: 14px 14px 18px;
                    }
                    .ws-title {
                        left: 12px;
                        top: 10px;
                        font-size: 16px;
                    }
                    #waiting-screen-start-btn {
                        padding: 14px 18px;
                    }
                }
            </style>

        <script type="module">
            const screenEl = document.getElementById('waiting-screen')
            const startBtn = document.getElementById('waiting-screen-start-btn')
            let isStarted = false

            async function startApp() {
                if (isStarted) return
                isStarted = true
                if (screenEl) screenEl.style.display = 'none'
                try {
                    const mainModule = await import('./src/main.js')
                    if (typeof mainModule.init === 'function') mainModule.init()
                } catch (error) {
                    const { logger } = await import('./src/core/logger.js')
                    logger.error('WaitingScreen', 'Failed to load main application:', error)
                }
            }

            if (startBtn) {
                startBtn.classList.add('ready')
                startBtn.addEventListener('click', () => startApp())
            }
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isStarted) startApp()
            })
        </script>
