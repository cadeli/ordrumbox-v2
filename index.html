<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:">
  
  <title>orDrumbox | Free Online Drum Machine & Step Sequencer</title>
  <meta name="description" content="Create beats with orDrumbox, a free online drum machine. Features step sequencer, soft synth, LFO modulators, and WAV export.">
  
  <meta property="og:title" content="orDrumbox - Free Online Drum Machine">
  <meta property="og:description" content="Create, customize, and export drum patterns directly in your browser.">
  <meta property="og:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <meta property="og:url" content="https://www.ordrumbox.com">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="orDrumbox | Online Beat Maker">
  <meta name="twitter:image" content="https://www.ordrumbox.com/assets/images/ordrumbox-online-screenshot.png">
  <link rel="canonical" href="https://www.ordrumbox.com">
  <link rel="preload" href="assets/images/logo-big.png" as="image" fetchpriority="high">
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "online orDrumbox",
        "description": "Create you own patterns with powerfull custom controls using various styles drumkits ",
        "url": "https://www.ordrumbox.com/index.html",
        "applicationCategory": "Music",
        "operatingSystem": "Web",
        "screenshot": "https://www.ordrumbox.com/assets/images/jsdrumbox-screenshot.png",
        "inLanguage": "en-US",
        "author": {
            "@type": "Organization",
            "name": "orDrumbox Team",
            "url": "https://www.ordrumbox.com"
        },
        "applicationSubCategory": "Music Composition",
        "applicationFeature": [
            "Music Sequencing",
            "Drum Kits",
            "Demo Patterns",
            "Filters",
            "Triggers",
            "Midi",
            "LFO Modulators",
            "Virtual Drum Machine",
            "Virtual Synth"
        ]
    }
    </script>
 
  

  <link rel="stylesheet" href="./src/ui/styles.css" id="ui-styles">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: var(--text, #fff);
      background-color: var(--bg-deep, #0a0a14);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    #app-main {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    @media (min-width: 1901px) and (min-height: 1091px) {
      #app-main {
        max-width: 1900px;
        max-height: 1090px;
        margin: auto;
        border: 1px solid var(--border-subtle, #333);
        border-radius: 4px;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
    }

    /* Waiting screen — inlined to prevent CLS */
    #waiting-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
      background-color: var(--bg-surface, #12121e);
      z-index: var(--z-toast, 9999);
    }
    #waiting-screen img {
      max-width: 100%;
      height: auto;
      pointer-events: none;
    }
    #waiting-screen-start-btn {
      position: absolute;
      top: 66.67%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 36px;
      font-size: var(--fs-lg, 14px);
      font-weight: bold;
      border: 2px solid var(--text, #fff);
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--color-warning, #f59e0b);
      color: var(--text, #fff);
      touch-action: manipulation;
      transition: background-color 0.2s, transform 0.1s;
      z-index: 1;
    }
    #waiting-screen-start-btn:hover {
      transform: translate(-50%, -50%) scale(1.02);
    }
    #waiting-screen-start-btn.ready {
      background-color: var(--color-info, #4fc3f7);
      color: var(--text, #fff);
      border-color: var(--accent, #e94560);
    }
  </style>
</head>
<body>
  <main id="app-main" aria-label="orDrumbox Beat Maker" role="application">
    <div id="waiting-screen">
      <img src="assets/images/logo-big.png" alt="orDrumbox v2" width="600" height="300" fetchpriority="high">
      <button id="waiting-screen-start-btn">Start orDrumbox V2</button>
    </div>
  </main>
  <script type="module" crossorigin src="./src/waiting_screen.js"></script>
</body>
</html>
