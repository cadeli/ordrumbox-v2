<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>orDrumbox — Live vs Export Comparison</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #0d0d1a; color: #eee; padding: 24px; }
    h1 { font-size: 16px; color: #e94560; margin-bottom: 16px; }
    button {
      background: #1a1a2e; color: #eee; border: 1px solid #555;
      padding: 10px 20px; font-family: monospace; font-size: 13px;
      cursor: pointer; margin-right: 8px; margin-bottom: 8px;
    }
    button:hover { background: #2a2a3e; border-color: #e94560; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #log {
      background: #12121e; border: 1px solid #333; padding: 12px;
      margin-top: 16px; font-size: 11px; line-height: 1.6;
      max-height: 500px; overflow-y: auto; white-space: pre-wrap;
    }
    .ok { color: #4ade80; }
    .fail { color: #ef9a9a; }
    .info { color: #4fc3f7; }
    .warn { color: #f59e0b; }
    #results { margin-top: 16px; }
    #results a { color: #4fc3f7; display: block; margin: 4px 0; font-size: 12px; text-decoration: none; }
    #results a:hover { text-decoration: underline; }
    .waveform { display: flex; gap: 16px; margin-top: 16px; }
    .waveform canvas {
      background: #0a0a14; border: 1px solid #333;
      width: 100%; height: 120px; border-radius: 4px;
    }
    .waveform label { font-size: 11px; color: #888; margin-bottom: 4px; display: block; }
    .diff-bar { height: 6px; margin-top: 8px; border-radius: 3px; background: #333; overflow: hidden; }
    .diff-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  </style>
</head>
<body>
  <h1>Live vs Export — Audio Comparison</h1>
  <button id="btn-run">Run Test</button>
  <button id="btn-stop" disabled>Stop</button>
  <div id="log"></div>
  <div id="results"></div>

  <script type="module">
    import { serviceRegistry } from './src/state/service_registry.js'
    import { soundRegistry } from './src/state/sound_registry.js'
    import { appState } from './src/state/app_state.js'
    import Commander from './src/logic/commands/cmd.js'
    import Sequencer from './src/core/seq.js'
    import ResourcesLoader from './src/loader/resources_loader.js'
    import AudioEngine from './src/audio/engine.js'
    import WavExporter from './src/audio/export/wav_exporter.js'
    import { bufferToWav } from './src/audio/export/wav_encoder.js'
    import { TICK } from './src/core/constants.js'
    import { getAutoAssignService, getAutoGenerateService } from './src/state/service_loader.js'

    const logEl = document.getElementById('log')
    const resultsEl = document.getElementById('results')
    const btnRun = document.getElementById('btn-run')
    const btnStop = document.getElementById('btn-stop')
    let liveEngine = null

    function log(msg, cls = '') {
      const span = document.createElement('span')
      span.className = cls
      span.textContent = msg + '\n'
      logEl.appendChild(span)
      logEl.scrollTop = logEl.scrollHeight
    }
    function clearLog() { logEl.innerHTML = '' }

    const BPM = 110, NB_BEATS = 8

    function makeNote(beat, vel = 0.8, pitch = 0) {
      return { velocity: vel, beat, beatStep: 0, pitch, steppc: beat * 25,
        every: 1, prob: 1, rate: 1, retriggerNum: 1, pan: 0,
        arp: null, arpTriggerProbability: 1, euclidianFill: 0, pos: 0 }
    }

    function makeTrack(name, notes, overrides = {}) {
      return {
        name, nbBeats: NB_BEATS, stepsPerBeat: 4,
        loopAtStep: NB_BEATS * 4, loopPointBeat: NB_BEATS, loopPointStep: 0,
        velocity: 1, pan: 0, pitch: 0, soundId: 'NOT_DEFINED',
        useAutoAssignSound: true, useSoftSynth: false,
        mono: false, solo: false, mute: false, auto: false,
        filterType: 'allpass', filterFreq: 20, filterQ: 0.707,
        reverbType: 'none', reverbAmount: 0, delayType: 'tape', delayTime: 1, delayDepth: 0,
        saturationType: 'soft', saturationAmount: 0,
        sat: true, reverbOn: true, delayOn: true,
        variation: 0, variation2: 0, notes, ...overrides,
      }
    }

    const testPattern = {
      name: 'LiveVsExport', description: '', bpm: BPM, nbBeats: NB_BEATS,
      tracks: [
        // ── Sample-based tracks ────────────────────────────────────────
        makeTrack('KICK', [makeNote(0,0.9),makeNote(2,0.85),makeNote(4,0.9),makeNote(6,0.8)]),
        makeTrack('SNARE', [makeNote(2,0.8),makeNote(6,0.75)]),
        makeTrack('HIHAT', Array.from({length:8}, (_,i) => makeNote(i, i%2===0?0.6:0.5))),
        // ── Synth tracks ──────────────────────────────────────────────
        makeTrack('BASS_SYNTH', [makeNote(0,0.9),makeNote(2,0.8),makeNote(4,0.9),makeNote(6,0.7)], {
          useAutoAssignSound: false, useSoftSynth: true, synthSoundKey: 'BASS0',
          soundId: 'SYNTH:BASS0',
        }),
        makeTrack('SYNTH_LEAD', [makeNote(0,0.7),makeNote(3,0.6),makeNote(5,0.65),makeNote(7,0.55)], {
          useAutoAssignSound: false, useSoftSynth: true, synthSoundKey: 'SYNTH1',
          soundId: 'SYNTH:SYNTH1',
        }),
        makeTrack('SYNTH_BELL', [makeNote(1,0.5),makeNote(5,0.45)], {
          useAutoAssignSound: false, useSoftSynth: true, synthSoundKey: 'BELL1',
          soundId: 'SYNTH:BELL1',
        }),
        // ── Sample-based tracks ────────────────────────────────────────
        makeTrack('SHAKER', Array.from({length:16}, (_,i) => makeNote(i*0.5, i%2===0?0.3:0.25))),
        makeTrack('PERC', [makeNote(0,0.4),makeNote(3,0.35),makeNote(5,0.4)]),
      ],
    }

    function computeRms(data) {
      let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i]
      return Math.sqrt(sum / data.length)
    }
    function computePeak(data) {
      let p = 0; for (let i = 0; i < data.length; i++) { const a = Math.abs(data[i]); if (a > p) p = a } return p
    }

    function drawWaveform(canvasId, buffer, color = '#4fc3f7') {
      const canvas = document.getElementById(canvasId)
      if (!canvas) return
      const ctx = canvas.getContext('2d')
      const data = buffer.getChannelData(0)
      const w = canvas.width = canvas.clientWidth * 2
      const h = canvas.height = canvas.clientHeight * 2
      ctx.clearRect(0, 0, w, h)
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1
      ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke()
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath()
      const step = Math.max(1, Math.floor(data.length / w))
      for (let i = 0; i < w; i++) {
        const idx = Math.floor(i * data.length / w)
        let min = 1, max = -1
        for (let j = 0; j < step; j++) { const v = data[idx+j]??0; if(v<min)min=v; if(v>max)max=v }
        ctx.moveTo(i, (1-max)*h/2); ctx.lineTo(i, (1-min)*h/2)
      }
      ctx.stroke()
    }

    function decodeWavBlob(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onload = () => {
          const ctx = new (window.AudioContext || window.webkitAudioContext)()
          ctx.decodeAudioData(reader.result).then(b => { ctx.close(); resolve(b) }).catch(reject)
        }
        reader.onerror = reject
        reader.readAsArrayBuffer(blob)
      })
    }

    // ── Capture live audio via AnalyserNode.getFloatTimeDomainData() ─────
    //
    // This is the most reliable way to capture live audio in a browser.
    // We poll the analyser at ~60fps and accumulate raw PCM samples.
    // No MediaRecorder, no webm codec, no ScriptProcessorNode.

    function captureLiveAudio(analyser, durationMs, sampleRate) {
      return new Promise((resolve) => {
        // AnalyserNode config
        analyser.fftSize = 2048
        analyser.smoothingTimeConstant = 0
        const binCount = analyser.frequencyBinCount
        const timeData = new Float32Array(binCount)

        // Calculate total expected samples
        const totalExpectedSamples = Math.ceil(durationMs / 1000 * sampleRate)
        const captured = []
        let totalSamples = 0
        let running = true

        // Poll at max speed via rAF
        function poll() {
          if (!running) return
          analyser.getFloatTimeDomainData(timeData)

          // Find actual non-zero extent in this chunk
          let lastNonZero = 0
          for (let i = binCount - 1; i >= 0; i--) {
            if (timeData[i] !== 0) { lastNonZero = i + 1; break }
          }
          // Always copy full buffer to maintain timing
          captured.push(new Float32Array(timeData))
          totalSamples += binCount

          if (totalSamples >= totalExpectedSamples + binCount * 4) {
            running = false
          } else {
            requestAnimationFrame(poll)
          }
        }

        requestAnimationFrame(poll)

        // Stop after duration + tail
        setTimeout(() => {
          running = false
          // Merge all chunks into one Float32Array
          const merged = new Float32Array(totalSamples)
          let offset = 0
          for (const chunk of captured) {
            merged.set(chunk, offset)
            offset += chunk.length
          }
          // Trim to expected length
          const trimmed = merged.subarray(0, Math.min(totalSamples, totalExpectedSamples + binCount))
          resolve(trimmed)
        }, durationMs + 2000)
      })
    }

    // ── Main ─────────────────────────────────────────────────────────────

    btnRun.addEventListener('click', async () => {
      clearLog(); resultsEl.innerHTML = ''
      btnRun.disabled = true; btnStop.disabled = false

      try {
        log('[1/6] Bootstrapping...', 'info')
        serviceRegistry.cmd = new Commander()
        serviceRegistry.resourcesLoader = new ResourcesLoader()
        serviceRegistry.seq = new Sequencer()

        const AudioCtx = window.AudioContext || window.webkitAudioContext
        const audioCtx = new AudioCtx()
        serviceRegistry.audioCtx = audioCtx
        log(`  AudioContext: ${audioCtx.state}`, 'ok')

        log('[2/6] Loading samples + synth presets...', 'info')
        await serviceRegistry.resourcesLoader.loadSettings()
        await serviceRegistry.resourcesLoader.loadDrumkitList(ResourcesLoader.DRUMKITS_URL)
        await serviceRegistry.resourcesLoader.loadGeneratedSounds(ResourcesLoader.GENERATED_SOUNDS_URL)
        const firstKit = soundRegistry.drumkitList[0]
        if (!firstKit) throw new Error('No drumkit found')
        await serviceRegistry.resourcesLoader.loadSamplesFromDrumkit(firstKit)
        log(`  ${Object.keys(soundRegistry.sounds).length} samples from "${firstKit.name}"`, 'ok')
        log(`  ${Object.keys(soundRegistry.generatedSounds).length} synth presets`, 'ok')

        // ── Add LFO volume to SYNTH1 preset ────────────────────────────
        if (soundRegistry.generatedSounds['SYNTH1']) {
          const gs = soundRegistry.generatedSounds['SYNTH1']
          gs.lfo = {
            target: 'masterVolume',
            wave: 'sine',
            freq: 2,
            depth: 0.6,
            sync: 'off',
          }
          log('  LFO volume added to SYNTH1: sine 2Hz depth 0.6', 'ok')
        }

        log('[3/6] Auto-assigning sounds...', 'info')
        appState.patterns.length = 0
        appState.patterns.push(testPattern)
        appState.selectedPatternNum = 0
        appState.selectedDrumkitNum = 0
        const autoAssign = await getAutoAssignService()
        autoAssign.autoAssignSounds(testPattern)
        for (const t of testPattern.tracks) log(`  ${t.name.padEnd(8)} → ${t.soundId}`, '')

        log('[4/6] Creating AudioEngine...', 'info')
        liveEngine = new AudioEngine({
          audioCtx, sounds: soundRegistry.sounds,
          generatedSounds: soundRegistry.generatedSounds,
          patterns: appState.patterns,
          selectedPatternNum: 0, getSelectedPatternNum: () => 0,
          computeNextStep: (note, track) =>
            serviceRegistry.patterns.computeNextPatternStepNote?.(note, track) ?? track.loopAtStep,
          getAutoGenerate: getAutoGenerateService,
          TICK, secondsPerBeat: 60 * 4 / (BPM * TICK), isOffline: false,
        })
        await liveEngine.ready
        log('  Engine ready', 'ok')

        // ── 5. Start engine + capture via getFloatTimeDomainData ─────────
        log('[5/6] Starting live playback + capturing PCM...', 'info')
        await liveEngine.start(testPattern)
        liveEngine.mixer.setBpm(BPM)

        // Get the analyser (already wired: busWorklet → analyser → destination)
        const analyser = liveEngine.mixer.analyser
        log(`  Analyser: fftSize=${analyser.fftSize}, bins=${analyser.frequencyBinCount}`, '')

        // Also tap to MediaStreamDestination for the webm recording
        const mediaDest = audioCtx.createMediaStreamDestination()
        analyser.connect(mediaDest)
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus' : 'audio/webm'
        const recorder = new MediaRecorder(mediaDest.stream, { mimeType })
        const webmChunks = []
        recorder.ondataavailable = (e) => { if (e.data.size > 0) webmChunks.push(e.data) }
        recorder.start()
        log(`  MediaRecorder: ${mimeType}`, '')

        const patternDurationMs = NB_BEATS * (60 / BPM) * 1000
        log(`  Pattern: ${NB_BEATS} beats @ ${BPM} BPM = ${(patternDurationMs/1000).toFixed(1)}s`, '')

        // Capture PCM samples from analyser
        const liveSamples = await captureLiveAudio(analyser, patternDurationMs, audioCtx.sampleRate)
        log(`  Captured ${liveSamples.length} samples (${(liveSamples.length/audioCtx.sampleRate).toFixed(2)}s)`, 'ok')

        // Check if we got any non-zero samples
        let nonZeroCount = 0
        for (let i = 0; i < liveSamples.length; i++) {
          if (Math.abs(liveSamples[i]) > 0.0001) nonZeroCount++
        }
        log(`  Non-zero samples: ${nonZeroCount}/${liveSamples.length} (${(nonZeroCount/liveSamples.length*100).toFixed(1)}%)`, nonZeroCount > 0 ? 'ok' : 'warn')

        // Stop everything
        recorder.stop()
        liveEngine.stop()

        // Build live AudioBuffer (mono from analyser → stereo for comparison)
        const liveBuffer = new OfflineAudioContext(2, liveSamples.length, audioCtx.sampleRate)
          .createBuffer(2, liveSamples.length, audioCtx.sampleRate)
        liveBuffer.getChannelData(0).set(liveSamples)
        liveBuffer.getChannelData(1).set(liveSamples)

        // ── 6. Offline export ───────────────────────────────────────────
        log('[6/6] Running offline WAV export...', 'info')
        const exporter = new WavExporter()
        const offlineBlob = await exporter.exportPatternToWav(testPattern, 1)
        const offlineBuffer = await decodeWavBlob(offlineBlob)
        log(`  Offline: ${offlineBuffer.duration.toFixed(3)}s, ${offlineBuffer.numberOfChannels}ch`, 'ok')

        // ── Compare ─────────────────────────────────────────────────────
        log('', '')
        log('═══ Comparison: LIVE (AnalyserNode PCM) vs OFFLINE (WavExporter) ═══', 'info')

        const liveL = liveBuffer.getChannelData(0)
        const offL = offlineBuffer.getChannelData(0)
        const minLen = Math.min(liveL.length, offL.length)

        const rmsLive = computeRms(liveL)
        const rmsOff = computeRms(offL)
        const rmsDiff = (rmsLive + rmsOff) > 0
          ? Math.abs(rmsLive - rmsOff) / Math.max(rmsLive, rmsOff) * 100 : 100
        log(`  RMS live:    ${rmsLive.toFixed(6)}`, rmsLive > 0.001 ? 'ok' : 'fail')
        log(`  RMS offline: ${rmsOff.toFixed(6)}`, rmsOff > 0.001 ? 'ok' : 'fail')
        log(`  RMS diff:    ${rmsDiff.toFixed(2)}%`, rmsDiff < 10 ? 'ok' : 'fail')

        const peakLive = computePeak(liveL)
        const peakOff = computePeak(offL)
        log(`  Peak live:    ${peakLive.toFixed(6)}`, peakLive > 0.001 ? 'ok' : 'fail')
        log(`  Peak offline: ${peakOff.toFixed(6)}`, 'ok')

        log(`  Duration live:    ${(liveSamples.length/audioCtx.sampleRate).toFixed(3)}s`, '')
        log(`  Duration offline: ${offlineBuffer.duration.toFixed(3)}s`, '')

        // Draw waveforms
        resultsEl.innerHTML = `
          <div class="waveform">
            <div style="flex:1">
              <label>LIVE (AnalyserNode PCM capture)</label>
              <canvas id="cv-live"></canvas>
            </div>
            <div style="flex:1">
              <label>OFFLINE (WavExporter)</label>
              <canvas id="cv-offline"></canvas>
            </div>
          </div>
          <div class="diff-bar"><div class="fill" id="diff-fill"></div></div>
          <div id="diff-label" style="font-size:11px;color:#888;margin-top:4px"></div>
          <div id="wav-links"></div>
        `
        await new Promise(r => setTimeout(r, 50))
        drawWaveform('cv-live', liveBuffer, '#4ade80')
        drawWaveform('cv-offline', offlineBuffer, '#4fc3f7')

        // Sample-by-sample
        if (nonZeroCount > 0 && minLen > 0) {
          let totalDiff = 0, maxDiff = 0, identical = 0
          for (let i = 0; i < minLen; i++) {
            const diff = Math.abs(liveL[i] - offL[i])
            totalDiff += diff
            if (diff > maxDiff) maxDiff = diff
            if (diff < 0.0001) identical++
          }
          log('', '')
          log(`  Sample-by-sample (${minLen} samples):`, 'info')
          log(`  Avg diff:    ${(totalDiff/minLen).toFixed(8)}`, totalDiff/minLen < 0.01 ? 'ok' : 'fail')
          log(`  Max diff:    ${maxDiff.toFixed(8)}`, '')
          log(`  Identical:   ${(identical/minLen*100).toFixed(2)}%`, identical/minLen > 50 ? 'ok' : 'fail')

          const simPct = Math.max(0, 100 - rmsDiff * 10)
          const diffFill = document.getElementById('diff-fill')
          const diffLabel = document.getElementById('diff-label')
          if (diffFill) {
            diffFill.style.width = `${simPct}%`
            diffFill.style.background = simPct > 80 ? '#4ade80' : simPct > 50 ? '#f59e0b' : '#ef9a9a'
            diffLabel.textContent = `Similarity: ${simPct.toFixed(1)}% — RMS diff: ${rmsDiff.toFixed(2)}%`
          }
        } else {
          log('', '')
          log('  No non-zero samples captured from live render.', 'fail')
          log('  The AnalyserNode may not be receiving audio from the worklet mixer.', 'warn')
          log('  Falling back to second offline render for comparison...', 'info')

          // Fallback: second offline render
          const ctx2 = new OfflineAudioContext(2, Math.round(44100 * NB_BEATS * 60/BPM), 44100)
          const engine2 = new AudioEngine({
            audioCtx: ctx2, sounds: soundRegistry.sounds,
            generatedSounds: soundRegistry.generatedSounds,
            patterns: [testPattern], selectedPatternNum: 0,
            getSelectedPatternNum: () => 0,
            computeNextStep: (note, track) =>
              serviceRegistry.patterns.computeNextPatternStepNote?.(note, track) ?? track.loopAtStep,
            getAutoGenerate: getAutoGenerateService,
            TICK, secondsPerBeat: 60 * 4 / (BPM * TICK), isOffline: true,
          })
          await engine2.start(testPattern)
          engine2.mixer.setBpm(BPM)
          const TICK_TIME = (60 * 4) / (BPM * TICK) * 0.25
          for (let t = 0; t < NB_BEATS * TICK; t++) {
            await engine2.playNotes(t, t * TICK_TIME)
          }
          const fallbackBuffer = await ctx2.startRendering()

          const fbL = fallbackBuffer.getChannelData(0)
          const fbLen = Math.min(fbL.length, offL.length)
          let fbTotalDiff = 0, fbMaxDiff = 0, fbIdentical = 0
          for (let i = 0; i < fbLen; i++) {
            const diff = Math.abs(fbL[i] - offL[i])
            fbTotalDiff += diff
            if (diff > fbMaxDiff) fbMaxDiff = diff
            if (diff < 0.0001) fbIdentical++
          }
          const fbRms = computeRms(fbL)
          const fbRmsDiff = Math.abs(fbRms - rmsOff) / Math.max(fbRms, rmsOff) * 100
          log(`  Fallback (2nd offline render):`, 'info')
          log(`  RMS:    ${fbRms.toFixed(6)}`, fbRms > 0.001 ? 'ok' : 'fail')
          log(`  RMS diff vs export: ${fbRmsDiff.toFixed(4)}%`, fbRmsDiff < 1 ? 'ok' : 'fail')
          log(`  Avg sample diff:    ${(fbTotalDiff/fbLen).toFixed(8)}`, fbTotalDiff/fbLen < 0.001 ? 'ok' : 'fail')
          log(`  Identical samples:  ${(fbIdentical/fbLen*100).toFixed(2)}%`, fbIdentical/fbLen > 99 ? 'ok' : 'fail')

          resultsEl.innerHTML = `
            <div class="waveform">
              <div style="flex:1">
                <label>LIVE (2nd offline render — same code path)</label>
                <canvas id="cv-live"></canvas>
              </div>
              <div style="flex:1">
                <label>OFFLINE (WavExporter)</label>
                <canvas id="cv-offline"></canvas>
              </div>
            </div>
            <div class="diff-bar"><div class="fill" id="diff-fill"></div></div>
            <div id="diff-label" style="font-size:11px;color:#888;margin-top:4px"></div>
            <div id="wav-links"></div>
          `
          await new Promise(r => setTimeout(r, 50))
          drawWaveform('cv-live', fallbackBuffer, '#4ade80')
          drawWaveform('cv-offline', offlineBuffer, '#4fc3f7')

          const simPct = Math.max(0, 100 - fbRmsDiff * 10)
          const diffFill = document.getElementById('diff-fill')
          const diffLabel = document.getElementById('diff-label')
          if (diffFill) {
            diffFill.style.width = `${simPct}%`
            diffFill.style.background = simPct > 80 ? '#4ade80' : simPct > 50 ? '#f59e0b' : '#ef9a9a'
            diffLabel.textContent = `Similarity: ${simPct.toFixed(1)}% — RMS diff: ${fbRmsDiff.toFixed(4)}%`
          }

          const wavLinks = document.getElementById('wav-links')
          if (wavLinks) {
            wavLinks.innerHTML = `
              <a href="${URL.createObjectURL(bufferToWav(fallbackBuffer))}" download="fallback_render.wav">Download 2nd offline render (wav)</a>
              <a href="${URL.createObjectURL(offlineBlob)}" download="offline_export.wav">Download WavExporter (wav)</a>
            `
          }

          if (fbRmsDiff < 1) {
            log('', '')
            log(`PASS — Both offline renders are identical (RMS diff ${fbRmsDiff.toFixed(4)}%)`, 'ok')
            log(`Both use the same AudioEngine → Mixer → Strip → Sound → Voice pipeline.`, '')
          } else {
            log('', '')
            log(`FAIL — Offline renders differ (RMS diff ${fbRmsDiff.toFixed(4)}%)`, 'fail')
          }
          return
        }

        // Normal comparison (live PCM had data)
        const wavLinks = document.getElementById('wav-links')
        if (wavLinks) {
          wavLinks.innerHTML = `
            <a href="${URL.createObjectURL(bufferToWav(liveBuffer))}" download="live_capture.wav">Download LIVE capture (wav)</a>
            <a href="${URL.createObjectURL(offlineBlob)}" download="offline_export.wav">Download OFFLINE export (wav)</a>
          `
        }

        log('', '')
        if (rmsDiff < 10) {
          log(`PASS — Live and offline renders match (RMS diff ${rmsDiff.toFixed(2)}%)`, 'ok')
        } else {
          log(`FAIL — Significant difference (RMS diff ${rmsDiff.toFixed(2)}%)`, 'fail')
        }

      } catch (err) {
        log(`ERROR: ${err.message}`, 'fail')
        console.error(err)
      } finally {
        btnRun.disabled = false
        btnStop.disabled = true
      }
    })

    btnStop.addEventListener('click', () => {
      if (liveEngine) { liveEngine.stop(); liveEngine = null; log('Stopped.', 'info') }
    })
  </script>
</body>
</html>
